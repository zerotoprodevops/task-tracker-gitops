apiVersion: apps/v1 
kind: Deployment
metadata: 
  name: task-tracker-api
  namespace: {{ .Values.namespace }}
  labels:
    tier: "backend"
    env: {{ .Values.env }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      tier: "backend"
      type: "api"
      env: {{ .Values.env }}
  template:
    metadata:
      name: api-pod
      labels:
        env: {{ .Values.env }}
        tier: "backend"
        type: "api"
    spec:
      containers:
        - name: api-container
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports:
            - containerPort: 5000
              name: "{{ .Values.env }}-api-port"
