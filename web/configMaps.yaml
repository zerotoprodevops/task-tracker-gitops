apiVersion: v1

kind: ConfigMap

metadata:
  name: nginx-config

data:
  task-tracker.conf: |
    server {
        listen 80 default_server;
        server_name test-tracker.com;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            proxy_pass http://api-service:5000/;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }