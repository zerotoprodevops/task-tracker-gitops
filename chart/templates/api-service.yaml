apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  ports:
    - name: "api-svc-port"
      protocol: TCP 
      port: 5000
      targetPort: "{{ .Values.env }}-api-port" 
  selector:
    env: {{ .Values.env }}
    tier: "backend"
    type: "api"