apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:
  name: task-tracker-app
  namespace: argocd


spec:
  project: default
  source:
    repoURL: https://github.com/zerotoprodevops/task-tracker-gitops.git
    targetRevision: main
    path: chart
    helm:
      valueFiles:
        - ./environment/dev-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
