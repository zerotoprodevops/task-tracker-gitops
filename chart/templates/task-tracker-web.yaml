apiVersion: apps/v1 
kind: Deployment
metadata:
  name: "task-tracker-web"
  namespace: {{  .Values.namespace }}
  labels:
    tier: "frontend"
    env: {{ .Values.env }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      env: {{ .Values.env }}
      tier: "frontend"
      type: "web"
  template:
    metadata:
      name: web-pod
      labels:
        env: {{ .Values.env }}
        tier: "frontend"
        type: "web"
    spec:
      containers:
        - name: "web-container"
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}" 
          ports:
            - containerPort: 80 
              name: "{{ .Values.env }}-web-port"  
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/task-tracker.conf
              subPath: task-tracker.conf
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config      

