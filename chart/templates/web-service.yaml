apiVersion: v1

kind: Service

metadata:
  name: "web-service" 
  namespace:  {{ .Values.namespace }}

spec:
  type: ClusterIP
  selector:
    env: {{ .Values.env }}
    tier: "frontend"
    type: "web"
  
  ports:
    - name: "web-svc-port"
      port: 80
      protocol: "TCP"
      targetPort: "{{ .Values.env }}-web-port"  