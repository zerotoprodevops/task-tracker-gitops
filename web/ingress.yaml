apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: task-tracker-ingress

spec:
  ingressClassName: nginx
  rules:
    - host: test-tracker.com
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: web-service
                port:
                  name: web-svc-port
          
