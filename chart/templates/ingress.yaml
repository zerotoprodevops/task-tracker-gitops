apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: task-tracker-ingress
  namespace: {{ .Values.namespace }}

spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: web-service
                port:
                  name: web-svc-port
          
